[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Add redirects for API proxying in production
[[redirects]]
  from = "/.netlify/functions/linear-proxy"
  to = "/.netlify/functions/linear-proxy"
  status = 200

[[redirects]]
  from = "/.netlify/functions/github-proxy"
  to = "/.netlify/functions/github-proxy"
  status = 200